services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    environment:
      # Демо-режим: ленты подготовлены заранее (prepare_demo) и при входе не пересобираются.
      # Для живого режима поставьте 1 — лента будет обновляться раз в час.
      FEED_AUTO_REFRESH: "${FEED_AUTO_REFRESH:-0}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
